<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script src="js/theme-init.js"></script>
<meta name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>termi</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sessions.css">
<link rel="stylesheet" href="css/topbar.css">
<link rel="stylesheet" href="css/panes.css">
<link rel="stylesheet" href="css/viewer.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/dialogs.css">
<link rel="stylesheet" href="css/session-tools.css">
<link rel="stylesheet" href="css/explore.css">
<link rel="stylesheet" href="css/pipelines.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body data-tab="sessions">
<div id="netbar" role="status" hidden>Mất kết nối tới máy chủ · đang thử lại…</div>
<div id="updbar" role="status" hidden>Có bản termi mới<button type="button" id="b-update">Tải lại</button></div>
<div id="app">
  <aside id="side">
    <div class="bar">
      <div class="brand"><img src="icon.svg" alt="">termi</div>
      <button class="ibtn" id="b-hist" title="Mở lại hội thoại cũ" aria-label="Mở lại hội thoại cũ"
        data-i="history"></button>
      <button class="ibtn" id="b-settings" title="Cài đặt" aria-label="Cài đặt" data-i="gear"></button>
      <button class="ibtn" id="b-bell" title="Thông báo" aria-label="Bật thông báo" data-i="bell"></button>
      <button class="ibtn only-mobile" id="b-new-m" title="Phiên mới" aria-label="Phiên mới" data-i="plus"></button>
    </div>
    <div class="machines" id="machines" hidden><select class="sel" id="machine" aria-label="Chọn máy"></select></div>
    <div class="sfind" id="sfind" hidden><input id="sq" type="search" placeholder="Tìm phiên…" aria-label="Tìm phiên"
      autocapitalize="off" autocomplete="off"></div>
    <div class="sfilt" id="sfilt" hidden></div>
    <div id="sessions"></div>
    <div class="side-foot"><button class="btn pri" id="b-new"><span data-i="plus"></span>Phiên mới</button></div>
  </aside>

  <section id="main">
    <div class="bar" id="top">
      <button class="ibtn only-mobile" id="b-back" aria-label="Danh sách phiên" data-i="back"></button>
      <button class="conn ok" id="conn" type="button" aria-label="Đã kết nối"></button>
      <div class="title"><b id="t-name">termi</b><span id="t-state" class="state"></span></div>
      <div class="doing" id="doing" hidden></div>
      <div class="seg" id="seg">
        <button data-t="chat"><span data-i="chat"></span>Chat</button>
        <button data-t="term"><span data-i="term"></span>Terminal</button>
        <button data-t="files"><span data-i="folder"></span>File</button>
        <button data-t="git"><span data-i="git"></span>Git</button>
        <button data-t="ci"><span data-i="zap"></span>Pipelines</button>
      </div>
      <button class="uchip" id="b-usage" type="button" hidden></button>
      <button class="ibtn" id="b-menu" aria-label="Tuỳ chọn phiên" data-i="more"></button>
    </div>

    <div class="stabs" id="stabs" hidden></div>
    <nav class="codetabs" id="codetabs" hidden>
      <button data-t="files"><span data-i="folder"></span>File</button>
      <button data-t="git"><span data-i="git"></span>Git</button>
      <button data-t="ci"><span data-i="zap"></span>Pipelines</button>
    </nav>
    <div id="panes">
      <div class="pane scroll" id="p-none"></div>

      <div class="pane" id="p-term" hidden>
        <div class="term-wrap">
          <button class="t-down" id="t-down" type="button" hidden><span data-i="refresh"></span>Mất kết nối<small
            id="t-down-note">Chạm để kết nối lại</small></button>
        </div>
        <div class="keys" id="keys"></div>
      </div>

      <div class="pane" id="p-chat" hidden><div class="scroll chat" id="chat-list"></div></div>


      <div class="pane" id="p-files" hidden>
        <div class="toolbar">
          <button class="ibtn" id="f-up" aria-label="Lên thư mục cha" data-i="up"></button>
          <button class="ibtn" id="f-home" aria-label="Về thư mục phiên" data-i="home"></button>
          <div class="crumb bc" id="f-crumb"></div>
          <button class="ibtn" id="f-find" aria-label="Tìm file theo tên" data-i="search"></button>
          <button class="ibtn" id="f-reload" aria-label="Tải lại" data-i="refresh"></button>
        </div>
        <div class="ffind" id="f-findbox" hidden>
          <input id="f-q" type="search" placeholder="Tìm file theo tên trong thư mục này…"
            autocapitalize="off" autocomplete="off" spellcheck="false">
        </div>
        <div class="scroll" id="f-list"></div>
      </div>

      <div class="pane" id="p-git" hidden>
        <div class="scroll">
          <div class="toolbar">
            <select class="sel" id="g-repo" aria-label="Repo" style="flex:1"></select>
            <button class="ibtn" id="g-reload" aria-label="Tải lại" data-i="refresh"></button>
          </div>
          <div class="toolbar">
            <select class="sel" id="g-branch" aria-label="Branch" style="flex:1"></select>
            <span class="chip" id="g-track"></span>
            <button class="btn sm" data-op="fetch" title="Lấy thông tin mới từ remote"><span
              data-i="refresh"></span>Fetch</button>
            <button class="btn sm" data-op="pull" title="Kéo commit mới về"><span data-i="down"></span>Pull</button>
            <button class="btn sm" data-op="push" title="Đẩy commit lên remote"><span data-i="up"></span>Push</button>
          </div>
          <div id="g-changes"></div>
          <div class="commit" id="g-commit-box">
            <textarea id="g-msg" rows="1" placeholder="Nội dung commit…" aria-label="Nội dung commit"></textarea>
            <button class="btn pri" id="g-commit">Commit</button>
          </div>
          <div class="grp"><span>Lịch sử</span><button class="btn sm" id="g-all">Xem toàn bộ thay đổi</button></div>
          <div class="log" id="g-log"></div>
        </div>
      </div>

      <div class="pane" id="p-ci" hidden>
        <div class="scroll">
          <div class="toolbar">
            <select class="sel" id="ci-repo" aria-label="Repo" style="flex:1"></select>
            <button class="ibtn" id="ci-reload" aria-label="Tải lại" data-i="refresh"></button>
          </div>
          <div class="cipanel" id="g-ci"></div>
        </div>
      </div>

      <div id="viewer" hidden>
        <div class="bar">
          <button class="ibtn" id="v-close" aria-label="Đóng" data-i="back"></button>
          <b id="v-title"></b>
          <button class="btn sm" id="v-alt" hidden></button>
          <button class="btn sm" id="v-insert" hidden>Chèn vào prompt</button>
        </div>
        <div class="scroll" id="v-body"></div>
      </div>
    </div>
    <div id="composer" hidden>
      <div class="outbox" id="outbox" hidden></div>
      <div class="confirm" id="confirm" hidden></div>
      <div class="atts" id="atts" hidden></div>
      <div class="suggest" id="suggest" hidden></div>
      <div class="compose">
        <button class="ibtn" id="b-quick" title="Thao tác nhanh" aria-label="Thao tác nhanh với agent"
          data-i="zap"></button>
        <button class="ibtn" id="b-photo" title="Gửi ảnh từ bộ sưu tập" aria-label="Gửi ảnh từ bộ sưu tập"
          data-i="image"></button>
        <button class="ibtn" id="b-attach" title="Gửi file" aria-label="Gửi file" data-i="clip"></button>
        <input type="file" id="f-photo" accept="image/*" multiple hidden>
        <input type="file" id="f-input" multiple hidden>
        <button class="ibtn" id="b-mic" title="Nói để nhập" aria-label="Nhập bằng giọng nói" data-i="mic"
          hidden></button>
        <textarea id="text" rows="1" placeholder="Nhắn cho agent…" aria-label="Nội dung gửi"></textarea>
        <button class="ibtn send" id="b-send" title="Gửi" aria-label="Gửi" data-i="send"></button>
      </div>
    </div>
  </section>

  <nav id="tabbar">
    <button data-t="sessions"><span data-i="list"></span>Phiên</button>
    <button data-t="chat"><span data-i="chat"></span>Chat</button>
    <button data-t="term"><span data-i="term"></span>Terminal</button>
    <button data-t="code"><span data-i="braces"></span>Code</button>
  </nav>
</div>

<dialog id="d-new">
  <form method="dialog">
    <h3>Phiên mới</h3>
    <div class="flabel">Agent</div>
    <div class="agchips" id="ag-chips" role="radiogroup" aria-label="Agent"></div>
    <select name="agent" hidden></select>
    <label>Gần đây<select id="pk-recent"></select></label>
    <label>Thư mục<input name="dir" required autocapitalize="off" autocomplete="off" spellcheck="false"></label>
    <div class="picker">
      <div class="pk-bar">
        <button type="button" class="ibtn" id="pk-up" aria-label="Lên thư mục cha" data-i="up"></button>
        <span class="crumb" id="pk-crumb"></span>
      </div>
      <div id="pk-list"></div>
    </div>
    <label><span>Tên phiên <small class="hint">· tự đặt theo thư mục</small></span><input name="name"
      placeholder="vd: termi" pattern="[A-Za-z0-9_\-]{1,40}" required autocapitalize="off" autocomplete="off"></label>
    <div class="acts"><button class="btn" type="button"
      onclick="this.closest('dialog').close('cancel')">Huỷ</button><button class="btn pri"
      value="ok">Tạo phiên</button></div>
  </form>
</dialog>

<dialog id="d-hist">
  <form method="dialog">
    <h3>Mở lại hội thoại</h3>
    <div id="hist-list"></div>
    <div class="acts"><button class="btn" value="cancel">Đóng</button></div>
  </form>
</dialog>

<dialog id="d-usage" class="sheet">
  <div class="sheet-head">
    <h3><span data-i="gauge"></span>Usage</h3>
    <button class="ibtn" type="button" aria-label="Đóng" onclick="this.closest('dialog').close()" data-i="x"></button>
  </div>
  <div class="sheet-body" id="usage-body"></div>
</dialog>

<dialog id="d-inbox" class="sheet">
  <div class="sheet-head">
    <h3><span data-i="bell"></span>Thông báo</h3>
    <button class="ibtn" type="button" aria-label="Đóng" onclick="this.closest('dialog').close()" data-i="x"></button>
  </div>
  <div class="sheet-body">
    <button class="btn sm" id="inbox-push" type="button">Bật thông báo đẩy</button>
    <div id="inbox-list"></div>
  </div>
</dialog>

<dialog id="d-settings" class="sheet">
  <div class="sheet-head">
    <h3><span data-i="gear"></span>Cài đặt</h3>
    <button class="ibtn" type="button" aria-label="Đóng" onclick="this.closest('dialog').close()" data-i="x"></button>
  </div>
  <div class="sheet-body" id="settings-body"></div>
</dialog>

<dialog id="d-cmd" class="palette" aria-label="Bảng lệnh">
  <div class="cmdh"><span data-i="search"></span><input id="cmd-q"
    placeholder="Tìm phiên, project, hội thoại hoặc lệnh…" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
  <div id="cmd-list"></div>
</dialog>

<dialog id="d-quick">
  <form method="dialog">
    <div class="row" style="padding:0"><h3 style="flex:1">Thao tác nhanh</h3><button class="btn sm" type="button"
      id="quick-edit">Sửa</button></div>
    <div class="quick" id="quick-list"></div>
    <div class="acts"><button class="btn" value="cancel">Đóng</button></div>
  </form>
</dialog>

<dialog id="d-menu">
  <form method="dialog" class="menu">
    <h3 id="m-title"></h3>
    <button class="btn" value="rename"><span data-i="edit"></span>Đổi tên phiên</button>
    <button class="btn" value="mute" id="m-mute"><span
      data-i="bell"></span><span>Tắt thông báo phiên này</span></button>
    <button class="btn danger" value="kill"><span data-i="trash"></span>Đóng phiên (dừng agent)</button>
    <button class="btn" value="cancel">Huỷ</button>
  </form>
</dialog>

<div id="toast" hidden></div>
<script type="module" src="js/main.mjs"></script>
</body>
</html>
