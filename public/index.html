<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<script>
// Gắn giao diện (sáng/tối) trước khi trang hiện ra để không bị nháy màu
try { var t = localStorage.getItem('termi-theme'); } catch (e) {}
document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>termi</title>
<style>
:root {
  --bg:#111318; --panel:#171a21; --card:#1d2129; --hover:#252a34; --line:#2a2f3a; --line2:#353b48;
  --fg:#e8eaee; --dim:#8d94a3; --faint:#5d6473;
  --acc:#e07a55; --acc-soft:#e07a5522; --ok:#4fbf7f; --ok-soft:#4fbf7f22; --warn:#e8b339; --warn-soft:#e8b33922;
  --add:#4fbf7f; --del:#ef6b73; --blue:#6aa7ff;
  --r:12px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-theme=light] { --bg:#f6f7f9; --panel:#ffffff; --card:#ffffff; --hover:#eef0f4; --line:#e4e7ec; --line2:#d5d9e0;
  --fg:#171a21; --dim:#5f6675; --faint:#9aa1ae; --acc:#c95f3a; --acc-soft:#c95f3a1a; --ok:#1f9d5c; --ok-soft:#1f9d5c1a;
  --warn:#b7810c; --warn-soft:#b7810c1a; --add:#1f9d5c; --del:#d33f49; --blue:#2f6fdf; color-scheme:light; }
:root[data-theme=dark] { color-scheme:dark; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
button,select,input,textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
svg.i { width:18px; height:18px; flex:none; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
[hidden] { display:none !important; }

/* ---------- Khung ---------- */
#netbar { position:fixed; top:env(safe-area-inset-top); left:50%; transform:translateX(-50%); z-index:30; margin-top:6px; padding:6px 14px; border-radius:99px; background:var(--warn); color:#1d1a10; font-size:13px; font-weight:600; box-shadow:0 4px 14px #0004; white-space:nowrap; }
#app { display:grid; grid-template-columns:300px minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100dvh; }
#side, #main { min-width:0; }
#side { display:flex; flex-direction:column; min-height:0; background:var(--panel); border-right:1px solid var(--line); padding-top:env(safe-area-inset-top); }
#main { display:flex; flex-direction:column; min-width:0; min-height:0; padding-top:env(safe-area-inset-top); }
#tabbar { display:none; }

.bar { display:flex; align-items:center; gap:6px; padding:4px 8px 4px 12px; min-height:48px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; flex:1; letter-spacing:-.01em; }
.brand img { width:26px; height:26px; border-radius:7px; }
.ibtn { display:inline-grid; place-items:center; width:36px; height:36px; border-radius:10px; border:0; background:transparent; color:var(--dim); }
.ibtn.on { color:var(--acc); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:38px; padding:0 14px; border-radius:10px; border:1px solid var(--line2); background:var(--card); font-size:14px; font-weight:500; white-space:nowrap; }
.btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
.btn.sm { height:32px; padding:0 10px; font-size:13px; }
.btn:disabled { opacity:.5; cursor:default; }
.btn.danger { color:var(--del); }

/* ---------- Danh sách phiên ---------- */
.machines { padding:8px 8px 0; }
.machines select { width:100%; }
.sfind { padding:8px 8px 0; }
.sfind input { width:100%; height:38px; padding:0 12px; border-radius:10px; border:1px solid var(--line2); background:var(--card); color:var(--fg); }
.sgrp { display:flex; align-items:center; gap:4px; padding:6px 0 0 6px; }
.sgrp span { flex:1; min-width:0; }
.sgrp .ibtn { width:30px; height:30px; flex:none; }
.sgrp.idle span { font-weight:500; opacity:.75; }
.sgrp span { font-size:11.5px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.welcome { display:flex; flex-direction:column; align-items:center; gap:12px; padding:28px 16px; margin:auto; width:100%; max-width:460px; text-align:center; }
.welcome img { width:56px; height:56px; border-radius:14px; }
.welcome h2 { margin:0; font-size:19px; }
.welcome p { margin:0; color:var(--dim); font-size:14px; }
.wl { display:flex; flex-direction:column; gap:8px; width:100%; margin-top:6px; text-align:left; }
.restore { margin-bottom:8px; border-color:var(--acc); }
.wcard { display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:var(--r); border:1px solid var(--line); background:var(--card); }
.wcard .wd { display:flex; align-items:center; gap:8px; min-width:0; }
.wcard .wd b { font-size:14px; } .wcard .wd small { color:var(--faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; flex:1; }
.wcard .wd svg.i { color:var(--blue); flex:none; }
.wcard .wa { display:flex; gap:6px; flex-wrap:wrap; }
.wbtn { display:inline-flex; align-items:center; height:34px; padding:0 12px 0 6px; border-radius:99px; border:1px solid var(--line2); background:var(--panel); font-size:13px; font-weight:500; }
.wbtn .av.sm { margin-right:6px; }
/* Cây project */
.pj { display:flex; align-items:center; gap:2px; margin-top:6px; }
.pjt { flex:1; min-width:0; display:flex; align-items:center; gap:6px; height:36px; padding:0 6px; border:0; border-radius:8px; background:transparent; color:var(--dim); font-size:13px; font-weight:600; text-align:left; }
.pjt svg.i { width:15px; height:15px; flex:none; } .pjt svg.i:first-child { transition:transform .12s; color:var(--faint); }
.pj.open .pjt svg.i:first-child { transform:rotate(90deg); }
.pjt svg.i:nth-child(2) { color:var(--blue); }
.pjn { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.pjc { flex:none; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--hover); color:var(--dim); font:600 11px/18px var(--mono); text-align:center; }
.pj .ibtn { width:32px; height:32px; flex:none; }
.si, .ci { display:flex; align-items:flex-start; gap:10px; width:100%; padding:7px 8px 7px 26px; border:0; border-radius:10px; background:transparent; text-align:left; }
.si.cur { background:var(--card); box-shadow:inset 0 0 0 1px var(--line2); }
.si .av.sm, .ci .av.sm { margin:1px 0 0; }
.sib { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
.sit { display:flex; align-items:center; gap:8px; } .sit .nm { flex:1; min-width:0; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sit .state { font-size:11.5px; } .sit .chgs { margin:0; font-size:11.5px; }
.sip .mdl { font-weight:600; color:var(--dim); margin-right:6px; } .sip .tmx { font:11.5px var(--mono); color:var(--faint); margin-right:6px; }
.sip { font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ci .cit { font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.ci .cim { font-size:11.5px; color:var(--faint); }
.ci { opacity:.85; }
.cmore { margin-left:26px; padding:4px 8px; border:0; background:transparent; color:var(--acc); font-size:12.5px; text-align:left; }
.cnone { margin-left:34px; padding:4px 0; font-size:12.5px; color:var(--faint); }
@media (hover: hover) { .si:hover, .ci:hover, .pjt:hover { background:var(--hover); } }
#sessions { flex:1; overflow:auto; padding:8px; display:flex; flex-direction:column; gap:4px; }
.sess { display:flex; flex-direction:row; align-items:flex-start; gap:12px; text-align:left; width:100%; padding:10px 12px; border-radius:var(--r); border:1px solid transparent; background:transparent; }
.sess.cur { background:var(--card); border-color:var(--line2); }
.sess .sb { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.sess .top { display:flex; align-items:center; gap:8px; }
/* Ô icon agent: logo Claude / OpenAI (Codex) từ Simple Icons (CC0), icon thường cho agent khác và shell */
.av { flex:none; width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--hover); color:var(--dim); }
.av svg { width:22px; height:22px; }
.av.claude { background:#d977571f; color:#d97757; }
.av.codex { background:color-mix(in srgb, var(--fg) 10%, transparent); color:var(--fg); }
.av.agy { background:#6aa7ff1f; color:var(--blue); }
.av.sm { width:22px; height:22px; border-radius:6px; display:inline-grid; vertical-align:-6px; margin-right:6px; }
.av.sm svg { width:13px; height:13px; }
.sess .nm { font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess .dir { font-size:12px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess .pv { font:11.5px/1.45 var(--mono); color:var(--dim); white-space:pre; overflow:hidden; text-overflow:ellipsis; max-height:3.1em; }
/* Câu trả lời gần nhất của agent: chữ thường, tối đa 2 dòng */
.sess .pv.reply { font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; white-space:normal; max-height:none; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.state { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--dim); white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.st-working .dot { background:var(--acc); animation:pulse 1.2s infinite; } .st-working { color:var(--acc); }
.st-waiting .dot { background:var(--warn); animation:pulse .8s infinite; } .st-waiting { color:var(--warn); }
.st-idle .dot { background:var(--ok); } .st-idle { color:var(--ok); }
@keyframes pulse { 50% { opacity:.3; } }
.empty { padding:32px 16px; text-align:center; color:var(--dim); display:flex; flex-direction:column; align-items:center; gap:12px; }
.side-foot { padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:8px; }
.side-foot .btn { flex:1; }

/* ---------- Thanh trên của phần chính ---------- */
#top .title { flex:1; min-width:0; display:flex; flex-direction:column; }
#top .title b { font-size:15px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#top .title span { font-size:11.5px; overflow:hidden; text-overflow:ellipsis; }
.seg { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; }
.seg button { display:flex; align-items:center; gap:6px; border:0; background:transparent; color:var(--dim); padding:6px 12px; border-radius:7px; font-size:14px; font-weight:500; }
.seg button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 2px #0003; }

#panes { flex:1; min-height:0; position:relative; }
.stabs { display:flex; gap:4px; padding:6px 8px 0; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); flex:none; }
.stabs::-webkit-scrollbar { display:none; }
.stab { flex:none; display:inline-flex; align-items:center; gap:2px; max-width:220px; height:34px; padding:0 10px 0 6px; border:1px solid transparent; border-bottom:0; border-radius:9px 9px 0 0; background:transparent; color:var(--dim); font-size:13px; }
.stab .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:6px; }
.stab.on { background:var(--card); border-color:var(--line); color:var(--fg); font-weight:600; }
.stab .av.sm { margin-right:6px; }
.pane { position:absolute; inset:0; display:flex; flex-direction:column; overflow:hidden; }
/* Chia đôi trên màn hình rộng: terminal trái, File/Git phải */
@media (min-width:1200px) {
  body.split #p-term { right:46%; }
  body.split #p-files, body.split #p-git, body.split #viewer { left:54%; border-left:1px solid var(--line); }
}
/* Mượt hơn: hiện dần khi chuyển trang, co nhẹ khi chạm */
@media (prefers-reduced-motion: no-preference) {
  .pane:not([hidden]), #viewer:not([hidden]), dialog[open] { animation:pane-in .16s ease-out; }
  .btn, .ibtn, .wbtn, .sess, .keys button, .sg, .irow { transition:transform .08s; }
  .btn:active, .ibtn:active, .wbtn:active, .sess:active, .keys button:active, .sg:active, .irow:active { transform:scale(.97); }
}
@keyframes pane-in { from { opacity:0; transform:translateY(4px); } }
.sk { height:44px; margin:8px 12px; border-radius:10px; background:linear-gradient(90deg, var(--hover) 25%, var(--card) 50%, var(--hover) 75%); background-size:300% 100%; animation:sk 1.2s infinite linear; }
.sk.tall { height:92px; margin:4px 0; }
@keyframes sk { from { background-position:100% 0; } to { background-position:-200% 0; } }
.chgs { display:inline-flex; align-items:center; gap:3px; margin-right:6px; color:var(--warn); font-weight:600; }
.chgs svg.i { width:12px; height:12px; }
#b-bell { position:relative; }
#b-bell[data-badge]:not([data-badge=""])::after { content:attr(data-badge); position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:99px; background:var(--del); color:#fff; font:700 10px/16px var(--mono); }
#inbox-push { margin-bottom:10px; }
.irow { display:flex; gap:10px; width:100%; padding:10px 0; border:0; border-top:1px solid var(--line); background:transparent; text-align:left; }
.irow .ik { flex:none; width:30px; height:30px; border-radius:9px; display:grid; place-items:center; }
.irow .ik.waiting { color:var(--warn); background:var(--warn-soft); } .irow .ik.done { color:var(--ok); background:var(--ok-soft); }
.irow .ik svg.i { width:16px; height:16px; }
.irow .it { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.irow .it b { font-size:14px; font-weight:500; } .irow .it small { color:var(--faint); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.suggest { display:flex; gap:6px; padding:8px 8px 0; overflow-x:auto; scrollbar-width:none; }
.suggest::-webkit-scrollbar { display:none; }
.sg { flex:none; display:inline-flex; align-items:baseline; gap:6px; max-width:80%; height:34px; padding:0 12px; border-radius:99px; border:1px solid var(--line2); background:var(--card); font-size:13px; }
.sg b { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .sg span { color:var(--faint); font-size:12px; white-space:nowrap; }
.scroll { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }

/* ---------- Terminal ---------- */
/* min-height:0: iframe mặc định cao tối thiểu 150px, không co lại khi bàn phím mở → đẩy ô nhắn ra ngoài */
.term-wrap { position:relative; flex:1; min-height:0; background:#16181d; }
#frame { display:block; width:100%; height:100%; border:0; background:#16181d; }
.t-down { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:0; background:rgba(13,15,19,.96); color:#fff; font-size:18px; font-weight:600; }
.t-down svg.i { width:34px; height:34px; margin-bottom:6px; }
.t-down small { font-size:14px; font-weight:400; opacity:.8; }
.keys button.fs { font-family:inherit; font-weight:600; }
.keys { display:flex; gap:6px; padding:8px 8px 0; overflow-x:auto; scrollbar-width:none; }
.keys::-webkit-scrollbar { display:none; }
.keys button { flex:none; height:34px; min-width:44px; padding:0 10px; border-radius:8px; border:1px solid var(--line2); background:var(--card); font:13px var(--mono); }
.keys button:active { background:var(--hover); }
.atts { display:flex; gap:8px; padding:8px 8px 0; overflow-x:auto; }
.att { position:relative; flex:none; height:60px; border-radius:10px; overflow:hidden; border:1px solid var(--line2); background:var(--card); }
.att img { width:60px; height:60px; object-fit:cover; display:block; }
.att.file { display:flex; align-items:center; gap:6px; max-width:180px; padding:0 30px 0 10px; font-size:12px; color:var(--dim); }
.att.file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.att.busy { opacity:.5; }
.att .x { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:0; background:#000b; color:#fff; font-size:13px; line-height:22px; padding:0; }
.compose { display:flex; align-items:flex-end; gap:6px; padding:8px; }
.compose textarea { flex:1; min-height:40px; max-height:160px; padding:9px 12px; border-radius:20px; border:1px solid var(--line2); background:var(--card); resize:none; line-height:1.4; }
.compose textarea:focus { outline:none; border-color:var(--acc); }
.compose .ibtn { width:36px; height:40px; border-radius:50%; flex:none; }
.compose .ibtn.send { width:40px; }
.compose .send { background:var(--acc); color:#fff; }

/* ---------- File ---------- */
.toolbar { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.crumb { flex:1; min-width:0; font:13px var(--mono); color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
.row { display:flex; align-items:center; gap:10px; width:100%; padding:10px 14px; border:0; border-bottom:1px solid var(--line); background:transparent; text-align:left; min-height:46px; }
.row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .meta { font-size:12px; color:var(--faint); white-space:nowrap; }
.row .i { color:var(--dim); }
.row .gdot { width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none; margin:0 6px; }
.row.dir .i { color:var(--blue); }
select.sel { height:38px; padding:0 10px; border-radius:10px; border:1px solid var(--line2); background:var(--card); max-width:100%; min-width:0; }

/* ---------- Git ---------- */
.grp { padding:12px 14px 4px; display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
.grp span { flex:1; }
.chg { display:flex; align-items:center; gap:10px; padding:6px 8px 6px 14px; min-height:44px; border-bottom:1px solid var(--line); }
.chg .p { flex:1; min-width:0; font:13px var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; direction:rtl; text-align:left; }
.badge { display:inline-grid; place-items:center; width:20px; height:20px; border-radius:5px; font:700 11px var(--mono); background:var(--hover); color:var(--dim); flex:none; }
.badge.M { color:var(--warn); background:var(--warn-soft); } .badge.A, .badge.U { color:var(--ok); background:var(--ok-soft); }
.badge.D { color:var(--del); background:#ef6b7322; } .badge.R { color:var(--blue); background:#6aa7ff22; }
.chip.synced { color:var(--ok); } .chip.ahead { color:var(--acc); } .chip.behind { color:var(--warn); }
.chip { font:12px var(--mono); padding:4px 8px; border-radius:6px; background:var(--hover); color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.commit { display:flex; gap:8px; padding:12px 14px; align-items:flex-end; }
.commit textarea { flex:1; min-height:40px; max-height:140px; padding:9px 12px; border-radius:10px; border:1px solid var(--line2); background:var(--card); resize:vertical; }
.log { padding:4px 0 24px; }
/* Hàng cao cố định, không viền: đường nối giữa các hàng liền mạch */
.cm { display:flex; align-items:center; height:56px; cursor:pointer; padding-right:14px; }
.cm svg { flex:none; overflow:visible; }
.cm-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.cm-msg { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cm.head .cm-msg { font-weight:600; }
.cm-meta { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--faint); overflow:hidden; white-space:nowrap; }
.cm-meta .h { font-family:var(--mono); color:var(--dim); }
.pill { font-size:11px; font-weight:600; padding:1px 7px; border-radius:99px; border:1px solid; flex:none; max-width:45%; overflow:hidden; text-overflow:ellipsis; }
.pill.head { background:var(--acc); border-color:var(--acc); color:#fff; }
.pill.br { color:var(--ok); border-color:var(--ok); }

// Ô icon cho phiên: logo agent, hoặc icon tên lửa (Antigravity) / terminal (shell)
function agentAvatar(agent, small) {
  const a = el('span', 'av' + (agent ? ' ' + agent : '') + (small ? ' sm' : ''));
  a.innerHTML = LOGO[agent] ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="${LOGO[agent]}"/></svg>`
    : icon(agent === 'agy' ? 'rocket' : 'term');
  a.title = agent ? agentName(agent) : 'Shell';
  return a;
}
const wide = () => matchMedia('(min-width: 900px)').matches;
const splitWide = () => matchMedia('(min-width: 1200px)').matches;

// Máy đang chọn (m trong URL): mọi API/terminal đi qua /m/<máy>; danh sách máy và thông báo luôn ở máy này
const base = () => st().m ? '/m/' + encodeURIComponent(st().m) : '';
const HUB_ONLY = /^\/api\/(machines|events|push\/)/; // máy trung tâm theo dõi mọi máy
async function api(path, body) {
  let r;
  try {
    r = await fetch(HUB_ONLY.test(path) ? path : base() + path, body ? { method:'POST', headers:{ 'content-type':'application/json', 'x-termi':'1' }, body:JSON.stringify(body) } : {});
  } catch (e) { // không tới được máy chủ (mất mạng, Tailscale chưa nối): báo, các vòng làm mới tự thử lại
    $('netbar').hidden = false;
    throw new Error('Mất kết nối tới máy chủ');
  }
  $('netbar').hidden = true;
  checkBuild(r.headers.get('x-termi-build'));
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
// Server có giao diện mới → tải lại, nhưng không khi đang gõ dở hoặc đang mở hộp thoại (tránh mất chữ)
let build;
function checkBuild(b) {
  if (!b) return;
  build ??= b;
  if (b !== build && !$('text').value && !$('g-msg').value && !S.atts.length && !document.querySelector('dialog[open]')) location.reload();
}
let toastT;
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 2500);
}
const safely = fn => (...a) => fn(...a).catch(e => toast(e.message, true));
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }

// ---------- Trạng thái trong URL: s=phiên, t=tab, d=thư mục file, g=repo git, v=đang xem ----------
const st = () => Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function go(patch) {
  const n = { ...st(), ...patch };
  for (const k in n) if (n[k] == null || n[k] === '') delete n[k];
  location.hash = new URLSearchParams(n).toString();
}
addEventListener('hashchange', render);

const S = { list: [], repos: null, seen: {}, atts: [] };
const cur = () => S.list.find(x => x.name === st().s);

function render() {
  const s = st();
  if ((s.m || '') !== S.machine) {
    S.machine = s.m || '';
    Object.assign(S, { list: [], loaded: false, dirs: null, termName: null, seen: {}, git: null, restore: [], projects: null });
    loadProjects();
    loadRestore();
    $('machine').value = S.machine;
    poll();
  }
  if (s.v && !$('v-body').childElementCount) return go({ v: null });
  let tab = s.t || (s.s ? 'term' : 'sessions');
  if (wide() && tab === 'sessions') tab = 'term';
  document.body.dataset.tab = tab;
  for (const b of document.querySelectorAll('#tabbar button, #seg button')) b.classList.toggle('on', b.dataset.t === tab);
  $('viewer').hidden = !s.v;
  renderSessions(); renderTop();
  const needSession = tab === 'term' || tab === 'files' || tab === 'chat';
  const gone = s.s && S.loaded && !cur(); // phiên đã đóng (vd. mở lại đường dẫn cũ): không mở terminal cho nó
  const show = needSession && (!s.s || gone) ? 'none' : tab;
  // Màn hình rộng: đang xem File/Git của một phiên thì terminal hiện bên trái
  const split = splitWide() && s.s && !gone && (show === 'files' || show === 'git');
  document.body.classList.toggle('split', !!split);
  for (const p of ['none', 'term', 'files', 'git', 'chat']) $('p-' + p).hidden = p !== show && !(split && p === 'term');
  $('composer').hidden = !(s.s && !gone && (show === 'term' || show === 'chat' || split));
  renderConfirm();
  // Bản nháp theo từng phiên: chuyển phiên không mất chữ đang gõ dở
  const dk = `${s.m || ''}/${s.s || ''}`;
  if (s.s && show !== 'none') markSeen(s.s);
  if (S.draftFor !== dk) { S.draftFor = dk; $('text').value = loadDraft(dk); autosize($('text')); }
  if (show === 'none') welcome($('p-none'));
  if (s.v) return; // đang xem file/diff: giữ nguyên pane phía sau, không tải lại
  if (show === 'term' || split) ensureTerm(s.s);
  if (show === 'chat') loadChat(true);
  if (show === 'files') loadFiles(s.d || cur()?.dir);
  if (show === 'git') loadGit(s.g || cur()?.dir);
}

// ---------- Phiên ----------
// Thời gian đã ở trạng thái hiện tại: "3 phút"
const dur = t => { const x = (Date.now() - t) / 1000; return x < 60 ? `${Math.max(1, x | 0)} giây` : x < 3600 ? `${x / 60 | 0} phút` : `${x / 3600 | 0} giờ ${(x % 3600) / 60 | 0} phút`; };
function stateEl(state, agent, since, model) {
  const e = el('span', 'state st-' + state);
  const live = since && (state === 'working' || state === 'waiting');
  e.append(el('span', 'dot'), (agent ? agentName(agent) + (model ? ' ' + model : '') + ' · ' : '') + (STATE[state] || '') + (live ? ' · ' + dur(since) : ''));
  return e;
}
// Danh sách phiên dạng cây project (giống Claude Code desktop): mỗi project thu/mở được, bên trong là
// phiên đang chạy (dòng gọn) và hội thoại cũ của project (chạm để mở lại).
const collapsedSet = () => new Set(JSON.parse(store.get('termi-collapsed') || '[]'));
function toggleProject(dir, open) {
  const c = collapsedSet(); open ? c.delete(dir) : c.add(dir);
  store.set('termi-collapsed', JSON.stringify([...c])); renderSessions();
}
function renderSessions() {
  const box = $('sessions'), sel = st().s;
  const projects = S.projects || [];
  if (!S.list.length && !projects.length) { $('sfind').hidden = true; welcome(box); return renderRestore(box); }
  $('sfind').hidden = S.list.length + projects.length < 4;
  const q = $('sq').value.trim().toLowerCase();
  const rank = { waiting: 0, working: 1 };
  const byDir = new Map();
  for (const x of S.list) byDir.set(x.dir, [...(byDir.get(x.dir) || []), x]);
  // Project từ máy chủ + project của phiên mới tạo (chưa kịp có trong danh sách project)
  const pinned = new Set(JSON.parse(store.get('termi-pinned') || '[]'));
  const dirs = [...new Set([...[...byDir.keys()], ...projects.map(p => p.dir)])].sort((a, b) => pinned.has(b) - pinned.has(a)); // ghim lên đầu
  const projOf = new Map(projects.map(p => [p.dir, p]));
  const running = new Set(S.list.map(x => x.convId).filter(Boolean));
  const collapsed = collapsedSet(), nodes = [];
  for (const dir of dirs) {
    const name = dir.split('/').pop() || dir;
    const sess = (byDir.get(dir) || []).filter(x => !q || (x.name + ' ' + name).toLowerCase().includes(q))
      .sort((a, b) => (rank[a.state] ?? 2) - (rank[b.state] ?? 2) || b.activity - a.activity);
    const convs = (projOf.get(dir)?.conversations || []).filter(c => !running.has(c.id) && (!q || (c.title + ' ' + name).toLowerCase().includes(q)));
    if (q && !sess.length && !convs.length && !name.toLowerCase().includes(q)) continue;
    // Mặc định: project có phiên đang chạy thì mở; đang tìm kiếm thì mở hết
    const open = q ? true : byDir.has(dir) ? !collapsed.has(dir) : collapsed.has('+' + dir);
    const h = el('div', 'pj' + (open ? ' open' : '')), add = el('button', 'ibtn');
    const t = el('button', 'pjt'); t.type = 'button';
    t.innerHTML = icon('chevron') + icon('folder');
    t.append(el('span', 'pjn', name));
    if (sess.length) t.append(el('span', 'pjc', String(sess.length)));
    const waiting = sess.some(x => x.state === 'waiting'), working = sess.some(x => x.state === 'working');
    if (waiting || working) { const d = el('span', 'state st-' + (waiting ? 'waiting' : 'working')); d.append(el('span', 'dot')); t.append(d); }
    t.title = dir;
    t.onclick = () => byDir.has(dir) ? toggleProject(dir, !open) : toggleProject('+' + dir, open);
    if (pinned.has(dir)) { const pin = el('span', 'pin'); pin.innerHTML = icon('pin'); t.append(pin); }
    // Giữ lâu (chuột phải) dòng project: ghim / bỏ ghim
    t.oncontextmenu = e => {
      e.preventDefault();
      pinned.has(dir) ? pinned.delete(dir) : pinned.add(dir);
      store.set('termi-pinned', JSON.stringify([...pinned]));
      toast(pinned.has(dir) ? `Đã ghim ${name}` : `Bỏ ghim ${name}`); renderSessions();
    };
    add.type = 'button'; add.innerHTML = icon('plus'); add.title = 'Phiên mới trong thư mục này'; add.setAttribute('aria-label', `Phiên mới trong ${dir}`);
    add.onclick = safely(() => quickStart(dir, sess.find(x => x.agent)?.agent || convs[0]?.agent || 'claude'));
    h.append(t, add);
    nodes.push(h);
    if (!open) continue;
    nodes.push(...sess.map(sessionRow));
    const more = S.moreConv?.[dir], shown = more ? convs : convs.slice(0, 3);
    nodes.push(...shown.map(c => convRow(dir, c)));
    if (convs.length > shown.length) {
      const m = el('button', 'cmore', `Xem thêm ${convs.length - shown.length} hội thoại`); m.type = 'button';
      m.onclick = () => { S.moreConv = { ...S.moreConv, [dir]: true }; renderSessions(); };
      nodes.push(m);
    }
    if (!sess.length && !convs.length) nodes.push(el('div', 'cnone', 'Chưa có phiên hay hội thoại nào'));
  }
  if (!nodes.length) nodes.push(el('div', 'empty', 'Không có gì khớp'));
  box.replaceChildren(...nodes);
  renderRestore(box);
  // Phiên đang chạy: một dòng gọn (logo nhỏ, tên, trạng thái) + một dòng xem trước
  function sessionRow(x) {
    const unread = x.replyAt && x.name !== sel && x.replyAt > (seenMap()[seenKeyOf(x.name)] || 0);
    const b = el('button', 'si' + (x.name === sel ? ' cur' : '') + (unread ? ' unread' : '')); b.type = 'button';
    if (unread) b.title = 'Có câu trả lời mới chưa xem';
    const top = el('div', 'sit'); top.append(el('span', 'nm', x.title || x.name), stateEl(x.state, null, x.since));
    if (x.changes) { const c = el('span', 'chgs'); c.innerHTML = icon('git'); c.append(x.changes); c.title = `${x.changes} file chưa commit`; top.append(c); }
    const body = el('div', 'sib'); body.append(top);
    // Dòng phụ: model · tên phiên tmux (khi khác tên hội thoại) · xem trước
    const sub = el('div', 'sip');
    if (x.model) sub.append(el('b', 'mdl', x.model));
    if (x.title && x.title !== x.name) sub.append(el('span', 'tmx', x.name));
    if (x.preview) sub.append(x.preview.replace(/\s+/g, ' '));
    if (sub.childNodes.length) body.append(sub);
    b.append(agentAvatar(x.agent, true), body);
    b.onclick = () => go({ s: x.name, t: 'term', d: null, g: null, v: null });
    b.oncontextmenu = e => { e.preventDefault(); openSessionMenu(x.name); }; // giữ lâu: đổi tên / đóng
    // Vuốt sang trái: menu đổi tên / đóng
    let sx = null, sy = 0;
    b.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    b.addEventListener('touchend', e => {
      if (sx === null) return;
      const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
      if (dx < -70 && Math.abs(dy) < 40) { e.preventDefault(); openSessionMenu(x.name); }
    });
    return b;
  }
  // Hội thoại cũ: chạm để mở lại đúng hội thoại trong một phiên mới
  function convRow(dir, c) {
    const b = el('button', 'ci'); b.type = 'button';
    const body = el('div', 'sib'); body.append(el('div', 'cit', c.title), el('div', 'cim', `${agentName(c.agent)} · ${ago(c.mtime)}`));
    b.append(agentAvatar(c.agent, true), body);
    b.title = 'Mở lại hội thoại này';
    b.onclick = safely(() => quickStart(dir, c.agent, c.id));
    return b;
  }
}
async function loadProjects() {
  const p = await api('/api/projects').catch(() => null);
  if (p) { S.projects = p; renderSessions(); }
}
$('sq').oninput = renderSessions;

// ---- Khôi phục phiên sau khi khởi động lại máy ----
async function loadRestore() {
  S.restore = await api('/api/restore').catch(() => []);
  renderSessions();
}
function renderRestore(box) {
  box.querySelector('.restore')?.remove();
  if (!S.restore?.length) return;
  const c = el('div', 'wcard restore'), names = el('div', 'wa'), acts = el('div', 'wa');
  const d = el('div', 'wd'); d.innerHTML = icon('history');
  d.append(el('b', null, `Khôi phục ${S.restore.length} phiên`), el('small', null, 'từ trước lần khởi động lại máy'));
  for (const x of S.restore) { const n = el('span', 'wbtn'); n.append(agentAvatar(x.agent, true), x.name); names.append(n); }
  const ok = el('button', 'btn pri sm', 'Khôi phục'), no = el('button', 'btn sm', 'Bỏ qua');
  ok.type = no.type = 'button';
  ok.onclick = safely(async () => {
    ok.disabled = true;
    const r = await api('/api/restore', {});
    toast(`Đã khôi phục ${r.done.length} phiên` + (r.failed.length ? ` · lỗi: ${r.failed.join('; ')}` : ''), !!r.failed.length);
    S.restore = []; await poll();
  });
  no.onclick = safely(async () => { await api('/api/restore/dismiss', {}); S.restore = []; renderSessions(); });
  acts.append(ok, no);
  c.append(d, names, acts);
  box.prepend(c);
}

// ---- Màn hình chào: khi chưa có phiên / chưa chọn phiên. Tạo nhanh phiên ở thư mục gần đây ----
async function welcome(box) {
  if (box.querySelector('.welcome')) return; // đã vẽ: không vẽ lại mỗi lần poll (tránh nháy)
  const w = el('div', 'welcome'), list = el('div', 'wl');
  w.innerHTML = '<img src="/icon.svg" alt="">';
  w.append(el('h2', null, S.list.length ? 'Chọn một phiên hoặc bắt đầu phiên mới' : 'Bắt đầu phiên đầu tiên'),
    el('p', null, 'Chọn thư mục và agent. Phiên chạy trong tmux trên máy, đóng app hay mất mạng vẫn còn nguyên.'), list);
  const more = el('button', 'btn'); more.type = 'button'; more.innerHTML = icon('folder') + 'Thư mục khác…'; more.onclick = newSession;
  w.append(more);
  box.replaceChildren(w);
  const [dirs, agents] = await Promise.all([api('/api/dirs').catch(() => ({ recent: [] })), api('/api/agents').catch(() => [])]);
  list.replaceChildren(...dirs.recent.slice(0, 4).map(dir => {
    const c = el('div', 'wcard'), d = el('div', 'wd'), a = el('div', 'wa');
    d.innerHTML = icon('folder');
    d.append(el('b', null, dir.split('/').pop() || dir), el('small', null, ltr(short(dir))));
    for (const ag of agents) {
      const b = el('button', 'wbtn'); b.type = 'button';
      b.append(agentAvatar(ag.id, true), ag.name);
      b.onclick = safely(() => quickStart(dir, ag.id));
      a.append(b);
    }
    c.append(d, a);
    return c;
  }));
}
// Tạo phiên đặt tên theo thư mục; trùng tên thì thêm -2, -3…
async function quickStart(dir, agent, resume) {
  const base = (dir.split('/').pop() || 'phien').replace(/[^A-Za-z0-9_-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32) || 'phien';
  for (let i = 1; i < 10; i++) {

  let y = null, acc = 0, moved = false;
  w.document.addEventListener('touchstart', e => {
    if (e.touches.length === 1) { y = e.touches[0].clientY; acc = 0; moved = false; }

    moved = true;

    while (Math.abs(acc) >= step) {

  }, opts);

// Hội thoại dạng bong bóng: bạn bên phải, agent bên trái (markdown). Lấy từ file hội thoại, tự cập nhật.
const ALLOWED_TAGS = new Set('P BR STRONG EM B I DEL S CODE PRE BLOCKQUOTE UL OL LI H1 H2 H3 H4 H5 H6 A TABLE THEAD TBODY TR TH TD HR SPAN INPUT'.split(' '));
// Câu trả lời của agent có thể chứa HTML (vd. trích code): dựng trong <template> trơ rồi lọc theo danh sách cho phép
function sanitize(root) {
  for (const n of [...root.querySelectorAll('*')]) {
    if (!ALLOWED_TAGS.has(n.tagName)) { n.replaceWith(document.createTextNode(n.textContent)); continue; }
    for (const a of [...n.attributes]) {
      const ok = (n.tagName === 'A' && a.name === 'href' && /^(https?:|mailto:)/i.test(a.value.trim()))
        || (n.tagName === 'CODE' && a.name === 'class' && /^language-[\w+-]+$/.test(a.value))
        || (n.tagName === 'INPUT' && ((a.name === 'type' && a.value === 'checkbox') || a.name === 'checked' || a.name === 'disabled'))
        || ((n.tagName === 'TH' || n.tagName === 'TD') && a.name === 'align');
      if (!ok) n.removeAttribute(a.name);

}

  const codes = t.content.querySelectorAll('pre > code');
  if (codes.length) {
    const hljs = await loadHljs().catch(() => null);
    if (hljs) for (const c of codes) {
      const lang = /language-([\w+-]+)/.exec(c.className)?.[1];
      if (lang && hljs.getLanguage(lang) && c.textContent.length < 100_000) c.innerHTML = hljs.highlight(c.textContent, { language: lang, ignoreIllegals: true }).value;

function openPalette() {
  if ($('d-cmd').open) return;
  const all = paletteItems(), input = $('cmd-q'), list = $('cmd-list');
  let shown = [], sel = 0;
  const draw = () => {
    const words = fold(input.value).split(/\s+/).filter(Boolean);
    shown = all.filter(it => { const h = fold(it.label + ' ' + it.hint); return words.every(w => h.includes(w)); }).slice(0, 40);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    list.replaceChildren(...(shown.length ? shown.map((it, i) => {
      const b = el('button', 'cmdi' + (i === sel ? ' on' : '')); b.type = 'button';
      b.innerHTML = icon(it.icon);
      const t = el('div'); t.append(el('b', null, it.label), el('small', null, it.hint)); b.append(t);
      b.onclick = () => runAt(i);

    }) : [el('div', 'empty', 'Không có gì khớp')]));
    list.querySelector('.on')?.scrollIntoView({ block: 'nearest' });

  const runAt = i => { const it = shown[i]; if (!it) return; $('d-cmd').close(); safely(async () => it.run())(); };
  input.value = ''; sel = 0;
  input.oninput = () => { sel = 0; draw(); };
  input.onkeydown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, shown.length - 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); runAt(sel); }

}

async function markdownNode(text, file) {
  const marked = await loadMarked();
  // <template> không tải ảnh hay chạy gì khi gán innerHTML: chỉ để sửa đường dẫn ảnh tương đối
  const t = document.createElement('template');
  t.innerHTML = marked.parse(text, { gfm: true });
  const base = 'file://' + file.slice(0, file.lastIndexOf('/') + 1);
  for (const img of t.content.querySelectorAll('img[src]')) {
    const src = img.getAttribute('src');
    if (!/^([a-z][a-z0-9+.-]*:|\/\/)/i.test(src)) img.src = rawUrl(decodeURIComponent(new URL(src, encodeURI(base)).pathname));
  }
  const diagrams = [...t.content.querySelectorAll('pre > code.language-mermaid')];
  for (const code of diagrams) code.parentElement.replaceWith(Object.assign(document.createElement('pre'), { className: 'mermaid', textContent: code.textContent }));
  // Không bao giờ có allow-same-origin: iframe là origin riêng, không đọc được gì của app và POST tới API bị CORS chặn.
  // Chỉ bật allow-scripts khi có sơ đồ, và CSP chỉ cho chạy đúng file mermaid (SRI) + đoạn khởi tạo (hash).
  let sandbox = 'allow-popups allow-popups-to-escape-sandbox', scripts = '';
  let csp = "default-src 'none'; img-src * data: blob:; style-src 'unsafe-inline'; font-src * data:";
  if (diagrams.length) {

    csp += `; script-src ${MERMAID.src} 'sha256-${btoa(String.fromCharCode(...new Uint8Array(digest)))}'`;
    scripts = `<script src="${MERMAID.src}" integrity="${MERMAID.sri}" crossorigin="anonymous"><\/script><script>${MERMAID.init}<\/script>`;
    sandbox += ' allow-scripts';

  f.title = 'Xem trước Markdown';
  f.srcdoc = `<!doctype html><html data-theme="${document.documentElement.dataset.theme}"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="${csp}"><base target="_blank"><style>${MD_CSS}</style><body>${t.innerHTML}${scripts}</body>`;
  return f;
}

// Diff hai cột: dòng xoá bên trái, dòng thêm bên phải, các dòng sửa đặt cạnh nhau
function diffSplitNode(text) {
  const box = el('div', 'dsplit'), rows = [];
  let dels = [], adds = [];
  const flush = () => {
    for (let i = 0; i < Math.max(dels.length, adds.length); i++) rows.push(['chg', dels[i] ?? null, adds[i] ?? null]);
    dels = []; adds = [];
  };
  for (const l of text.split('\n')) {
    if (l.startsWith('diff --git ')) { flush(); rows.push(['file', l.slice(l.lastIndexOf(' b/') + 3)]); }
    else if (/^(index |--- |\+\+\+ |new file|deleted file|similarity|rename |old mode|new mode|Binary)/.test(l)) flush();
    else if (l.startsWith('@@')) { flush(); rows.push(['hunk', l]); }
    else if (l[0] === '-') dels.push(l.slice(1));
    else if (l[0] === '+') adds.push(l.slice(1));
    else { flush(); rows.push(['ctx', l.slice(1), l.slice(1)]); }
  }
  flush();
  box.append(...rows.map(([kind, a, b]) => {
    if (kind === 'file') { const d = el('div', 'ds-file', a); d.dataset.file = a; return d; }
    if (kind === 'hunk') return el('div', 'ds-hunk', a);
    const row = el('div', 'ds-row');
    const cell = (v, cls) => el('div', 'ds-cell' + (v === null ? ' empty' : kind === 'chg' ? ' ' + cls : ''), v ?? '');
    row.append(cell(a, 'd'), cell(b, 'a'));
    return row;
  }));
  return box;
}

  await loadRepos($('g-repo'), dir);
  for (const o of $('g-repo').options) { o.title = o.value; o.textContent = o.value.split('/').pop() || o.value; } // tên repo ngắn
  dir ||= $('g-repo').value;
  if (!dir) return $('g-changes').replaceChildren(el('div', 'empty', 'Không tìm thấy repo git nào'));
  let g;
  if (S.git?.dir !== dir) { $('g-changes').replaceChildren(...skel(3)); $('g-log').replaceChildren(...skel(6)); }
  try { g = await api('/api/git?dir=' + encodeURIComponent(dir)); }
  catch (e) {
    $('g-changes').replaceChildren(el('div', 'empty', e.message)); $('g-log').replaceChildren();
    $('g-branch').replaceChildren(); $('g-track').textContent = '';
    return;
  }
  S.git = g;
  const [branch, track = ''] = g.head.split('...');
  // Trước/sau remote: "origin/main [ahead 1, behind 2]" → ↑1 ↓2
  const ahead = /ahead (\d+)/.exec(track)?.[1], behind = /behind (\d+)/.exec(track)?.[1];
  const chip = $('g-track');
  chip.className = 'chip' + (behind ? ' behind' : ahead ? ' ahead' : track ? ' synced' : '');
  chip.textContent = !track ? 'chưa có upstream' : /\[gone\]/.test(track) ? 'upstream đã mất'
    : ahead || behind ? [ahead && `↑${ahead}`, behind && `↓${behind}`].filter(Boolean).join(' ') : '✓ đồng bộ';
  chip.title = !track ? 'Nhánh chưa liên kết với remote' : `${ahead || 0} commit chưa push · ${behind || 0} commit chưa pull`;
  $('g-branch').replaceChildren(...[...new Set([branch, ...g.branches])].map(b => {
    const o = el('option', null, b === branch ? `⎇ ${b}` : b); o.value = b; o.selected = b === branch; return o;
  }));
  $('g-branch').dataset.cur = branch;

  const staged = g.files.filter(f => f.x !== ' ' && f.x !== '?');
  const changed = g.files.filter(f => f.y !== ' ');
  const group = (title, files, isStaged) => {
    if (!files.length) return [];
    const h = el('div', 'grp'); h.append(el('span', null, `${title} (${files.length})`));
    const all = el('button', 'btn sm', isStaged ? 'Bỏ stage hết' : 'Stage hết');
    all.onclick = () => gitOp(isStaged ? 'unstage' : 'stage', { paths: files.map(f => f.path) });
    h.append(all);
    return [h, ...files.map(f => {
      const code = isStaged ? f.x : f.y === '?' ? 'U' : f.y;
      const r = el('div', 'chg');
      const p = el('span', 'p', ltr(f.path)); p.title = f.path;
      p.onclick = () => f.y === '?' ? openFile(g.dir + '/' + f.path)
        : openDiff(f.path, { dir: g.dir, file: f.path, ...(isStaged ? { staged: 1 } : {}) });
      const act = el('button', 'ibtn'); act.innerHTML = icon(isStaged ? 'minus' : 'plus');
      act.setAttribute('aria-label', isStaged ? 'Bỏ stage' : 'Stage');
      act.onclick = () => gitOp(isStaged ? 'unstage' : 'stage', { paths: [f.path] });
      r.append(el('span', 'badge ' + code, code), p, act);
      return r;
    })];
  };
  const nodes = [...group('Đã stage', staged, true), ...group('Thay đổi', changed, false)];
  $('g-changes').replaceChildren(...(nodes.length ? nodes : [el('div', 'empty', 'Không có thay đổi nào ✓')]));
  $('g-commit-box').hidden = !staged.length;

  $('g-log').replaceChildren(...g.commits.map((c, i) => commitRow(c, g.graph.rows[i], g.graph.width, g.dir)));

// ---- Vẽ một hàng của cây commit ----
const LANE_COLORS = ['#e07a55', '#4fbf7f', '#6aa7ff', '#e8b339', '#c678dd', '#56b6c2', '#ef6b73', '#98c379'];

function commitRow(c, row, width, dir) {
  const lanes = Math.min(width, MAX_LANES), W = PAD * 2 + (lanes - 1) * LW;
  const X = l => PAD + l * LW, Y = [0, RH / 2, RH];
  const isHead = c.refs.some(r => r.startsWith('HEAD'));
  let svg = '';

    const x1 = X(a), y1 = Y[ya], x2 = X(b), y2 = Y[yb], ym = (y1 + y2) / 2;
    const color = LANE_COLORS[(ya === 0 && yb === 1 ? a : b) % LANE_COLORS.length];
    const d = x1 === x2 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}C${x1} ${ym} ${x2} ${ym} ${x2} ${y2}`;
    svg += `<path d="${d}" stroke="${color}" stroke-width="2" fill="none"/>`;
  }
  const color = LANE_COLORS[row.col % LANE_COLORS.length], cx = X(row.col);
  svg += c.p.length > 1
    ? `<circle cx="${cx}" cy="${RH / 2}" r="5" fill="var(--bg)" stroke="${color}" stroke-width="2.5"/>`
    : `<circle cx="${cx}" cy="${RH / 2}" r="${isHead ? 6 : 4.5}" fill="${color}"${isHead ? ' stroke="var(--bg)" stroke-width="2"' : ''}/>`;

  const r = el('div', 'cm' + (isHead ? ' head' : ''));
  r.insertAdjacentHTML('afterbegin', `<svg width="${W}" height="${RH}" viewBox="0 0 ${W} ${RH}" aria-hidden="true">${svg}</svg>`);
  const body = el('div', 'cm-body'), meta = el('div', 'cm-meta');
  for (const ref of c.refs) {
    const name = ref.replace(/^HEAD -> /, '').replace(/^tag: /, '');
    if (ref === 'HEAD' || name.endsWith('/HEAD')) continue;
    meta.append(el('span', 'pill ' + (ref.startsWith('HEAD -> ') ? 'head' : ref.startsWith('tag: ') ? 'tag' : name.includes('/') ? 'rm' : 'br'), name));
  }
  meta.append(el('span', 'h', c.h.slice(0, 7)), `${c.a} · ${ago(c.t)}`);
  body.append(el('div', 'cm-msg', c.s), meta);
  r.append(body);
  r.title = c.s;
  r.onclick = () => openDiff(c.h.slice(0, 7), { dir, rev: c.h });
  return r;
}
const gitOp = safely(async (op, extra = {}) => {
  const btns = document.querySelectorAll('#p-git button'); btns.forEach(b => b.disabled = true);
  try {
    if (['fetch', 'pull', 'push'].includes(op)) toast(`Đang ${op}…`);
    const r = await api('/api/git/op', { dir: S.git.dir, op, ...extra });
    if (r.output && op !== 'stage' && op !== 'unstage') toast(r.output.split('\n').slice(-3).join('\n'));
    if (op === 'commit') $('g-msg').value = '';
  } finally { btns.forEach(b => b.disabled = false); await loadGit(S.git.dir); }
});
for (const b of document.querySelectorAll('[data-op]')) b.onclick = () => gitOp(b.dataset.op);
$('g-commit').onclick = () => gitOp('commit', { message: $('g-msg').value });
$('g-msg').oninput = e => autosize(e.target);
$('g-repo').onchange = () => go({ g: $('g-repo').value });
$('g-reload').onclick = () => loadGit(S.git?.dir || $('g-repo').value);
$('g-all').onclick = () => openDiff('Thay đổi chưa commit', { dir: S.git.dir });
$('g-branch').onchange = e => {
  const b = e.target.value;
  if (confirm(`Chuyển sang branch "${b}"?`)) gitOp('checkout', { branch: b });
  else e.target.value = e.target.dataset.cur;
};

// ---------- Thông báo đẩy ----------
const b64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function pushState() {
  const reg = await navigator.serviceWorker?.getRegistration();
  $('b-bell').classList.toggle('on', !!(await reg?.pushManager?.getSubscription()) && Notification.permission === 'granted');
}
const enablePush = safely(async () => {
  if (!('serviceWorker' in navigator) || !('PushManager' in window))
    throw new Error('Trình duyệt chưa hỗ trợ thông báo. Trên iPhone: thêm termi vào Màn hình chính rồi mở từ biểu tượng đó.');
  if (await Notification.requestPermission() !== 'granted') throw new Error('Bạn chưa cho phép thông báo');
  const reg = await navigator.serviceWorker.ready;
  const { key } = await api('/api/push/key');
  const subscribe = () => reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
  let sub = await reg.pushManager.getSubscription() || await subscribe();
  await api('/api/push/sub', sub.toJSON());
  // Hiện thẳng kết quả gửi thử để biết lỗi nằm ở đâu (mã trả về của dịch vụ push)
  let { results = [] } = await api('/api/push/test', {});
  if (results.some(r => r.status === 404 || r.status === 410)) {
    // Trình duyệt vẫn giữ đăng ký mà dịch vụ push đã huỷ: huỷ hẳn rồi đăng ký lại một lần
    await sub.unsubscribe().catch(() => {});
    sub = await subscribe();
    await api('/api/push/sub', sub.toJSON());
    ({ results = [] } = await api('/api/push/test', {}));
  }
  const bad = results.filter(r => r.status < 200 || r.status > 299);
  if (!results.length) throw new Error('Server chưa nhận được đăng ký của máy này');
  if (bad.length) throw new Error('Gửi thử thất bại: ' + bad.map(r => `${r.host} ${r.status || ''} ${r.detail}`).join('; '));
  toast('Đã gửi thử thành công. Nếu vài giây nữa không thấy thông báo, kiểm tra quyền thông báo của Chrome trong Cài đặt Android.');
  pushState();
});
navigator.serviceWorker?.register('/sw.js').then(pushState).catch(() => {});

addEventListener('resize', () => { const t = (wide() ? 'w' : 'n') + (splitWide() ? 's' : ''); if (S.layout && S.layout !== t) render(); S.layout = t; });

// ---- Hộp thông báo: agent xong việc / cần xác nhận (cả khi chưa bật thông báo đẩy) ----
const seenKey = 'termi-events-seen';
const getSeen = () => { try { return Number(localStorage.getItem(seenKey)) || 0; } catch { return 0; } };
async function loadEvents() {
  const ev = await api('/api/events').catch(() => null);
  if (!ev) return;
  // Sự kiện mới khi đang mở app: báo nhẹ + rung (khi đóng app thì thông báo đẩy lo)
  if (S.events) for (const e of ev.filter(e => e.t > S.events[0]?.t || !S.events.length).reverse()) {
    toast(e.title);
    navigator.vibrate?.(e.kind === 'waiting' ? [120, 60, 120] : 40);
  }
  S.events = ev;
  const unseen = ev.filter(e => e.t > getSeen()).length;
  $('b-bell').dataset.badge = unseen ? String(Math.min(unseen, 9)) : '';
  if ($('d-inbox').open) renderInbox();
}
function renderInbox() {
  const list = S.events || [];
  $('inbox-list').replaceChildren(...(list.length ? list.map(e => {
    const b = el('button', 'irow'); b.type = 'button';
    const ic = el('span', 'ik ' + e.kind); ic.innerHTML = icon(e.kind === 'waiting' ? 'bell' : 'check');
    const t = el('div', 'it'); t.append(el('b', null, e.title), el('small', null, `${ago(e.t)}${e.body ? ' · ' + e.body : ''}`));
    b.append(ic, t);
    b.onclick = () => { $('d-inbox').close(); go({ s: e.session, t: 'term', m: e.machine || null, d: null, g: null, v: null }); };
    return b;
  }) : [el('div', 'empty', 'Chưa có thông báo nào')]));
}
$('b-bell').onclick = async () => {
  renderInbox(); $('d-inbox').showModal();
  try { localStorage.setItem(seenKey, String(Date.now())); } catch {}
  $('b-bell').dataset.badge = '';
  const reg = await navigator.serviceWorker?.getRegistration();
  const on = !!(await reg?.pushManager?.getSubscription()) && Notification.permission === 'granted';
  $('inbox-push').textContent = on ? 'Thông báo đẩy: đang bật · gửi thử' : 'Bật thông báo đẩy';
};
$('inbox-push').onclick = () => enablePush();
// ---- Chọn máy (các máy cùng tài khoản Tailscale có chạy termi) ----
async function loadMachines() {
  const list = await api('/api/machines').catch(() => []);
  $('machines').hidden = list.length < 2;
  $('machine').replaceChildren(...list.map(m => Object.assign(el('option', null,
    m.self ? `💻 ${m.name} (máy này)` : `🖥 ${m.name}${m.termi ? '' : m.online ? ' · chưa cài termi' : ' · offline'}`),
    { value: m.id, disabled: !m.termi })));
  $('machine').value = st().m || '';
}
$('machine').onchange = e => go({ m: e.target.value || null, s: null, d: null, g: null, v: null, t: wide() ? null : 'sessions' });
loadMachines();

// ---- Usage: hạn mức gói agent, token của phiên, tài nguyên máy ----
const level = p => p >= 90 ? 'bad' : p >= 70 ? 'warn' : '';
const kTok = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : Math.round(n / 1e3) + 'k';
const windowName = m => ({ 300: '5 giờ', 10080: '7 ngày', 43200: '30 ngày' })[m] || (m ? `${Math.round(m / 60)} giờ` : '');
const until = t => {
  const m = Math.round((t - Date.now()) / 60000);
  return m <= 0 ? 'sắp reset' : m < 60 ? `reset sau ${m} phút` : m < 1440 ? `reset sau ${Math.floor(m / 60)} giờ ${m % 60} phút` : `reset ${new Date(t).toLocaleDateString('vi-VN', { weekday: 'short', day: 'numeric', month: 'numeric' })}`;
};
// Các mục hạn mức của agent: [nhãn ngắn cho chip, tên đầy đủ, % , lúc reset]
function limitRows(agent, l) {
  if (agent === 'claude' && l.claude) return [['5h', 'Phiên 5 giờ', l.claude.fiveHour], ['7d', '7 ngày', l.claude.sevenDay]]
    .filter(r => r[2]).map(([s, n, w]) => [s, n, w.pct, w.resetsAt]);
  if (agent === 'codex' && l.codex) return [l.codex.primary, l.codex.secondary].filter(Boolean)
    .map(w => [windowName(w.minutes).replace(' giờ', 'h').replace(' ngày', 'd'), windowName(w.minutes), w.pct, w.resetsAt]);
  return [];
}
function renderUsageChip() {
  const u = S.usage, b = $('b-usage');
  if (!u) return (b.hidden = true);
  const agent = u.session?.agent, lim = limitRows(agent, u.limits)[0];
  // Ưu tiên: hạn mức gói của agent đang chạy → mức đầy ngữ cảnh → tải CPU
  const ctx = u.session?.context;
  const [label, pct, text] = lim ? [lim[0], lim[2]] : u.session?.pct != null ? ['ctx', Math.round(u.session.pct)]
    : ctx ? ['ctx', 0, kTok(ctx)] : ['CPU', u.machine.cpu];
  b.className = 'uchip ' + level(pct);
  b.replaceChildren(el('i'), `${label} ${text ?? pct + '%'}`);
  b.title = 'Usage: hạn mức, token, tài nguyên máy';
  b.hidden = false;
}
const ICON_COLOR = { claude: 'var(--acc)', codex: 'var(--blue)', ctx: '#a78bfa', machine: 'var(--ok)' };
function meterRow(name, pct, note, ic, color) {
  const r = el('div', 'urow'), top = el('div', 'top'), m = el('div', 'meter ' + level(pct ?? 0)), bar = el('span');
  if (ic) { const i = el('span', 'ic'); i.style.color = color; i.innerHTML = icon(ic); r.append(i); }
  top.append(el('b', null, name), el('span', null, pct == null ? '—' : pct + '%'));
  bar.style.width = Math.min(100, pct ?? 0) + '%'; m.append(bar);
  r.append(top, m);
  if (note) r.append(el('small', null, note));
  return r;
}
function group(title, ic, rows) {
  const g = el('div', 'ugrp'), h = el('h4'); h.innerHTML = icon(ic); h.append(title);
  g.append(h, ...rows); return g;
}
function renderUsageDialog() {
  const u = S.usage; if (!u) return;
  const parts = [];
  // Hạn mức gói
  const lim = [];
  for (const a of ['claude', 'codex']) {
    const rows = limitRows(a, u.limits);
    if (rows.length) lim.push(...rows.map(([short, n, p, t]) => meterRow(`${agentName(a)} · ${n}`, p, until(t), /d$/.test(short) ? 'calendar' : 'clock', ICON_COLOR[a])));
    else if (a === 'claude') lim.push(el('div', 'uempty', 'Claude: chưa có số liệu. Cần cài statusline của termi (xem README); chỉ gói Pro/Max/Ultra có hạn mức này.'));
  }
  parts.push(group('Hạn mức gói', 'gauge', lim));
  // Phiên đang mở
  const s = u.session;
  if (s?.agent) parts.push(group(`Phiên ${s.name} · ${agentName(s.agent)}`, 'term', [s.context != null
    ? meterRow('Ngữ cảnh', s.pct != null ? Math.round(s.pct) : s.window ? Math.round(s.context / s.window * 100) : null,
        `${kTok(s.context)}${s.window ? ' / ' + kTok(s.window) : ''} token${s.model ? ' · ' + s.model : ''}`, 'layers', ICON_COLOR.ctx)
    : el('div', 'uempty', 'Chưa có số liệu token cho phiên này')]));
  // Máy
  const m = u.machine;
  parts.push(group('Máy' + (st().m ? ' · ' + st().m : ''), 'monitor', [
    meterRow('CPU (tải 1 phút)', m.cpu, '', 'cpu', ICON_COLOR.machine),
    meterRow('RAM', m.mem, m.memTotal ? `${Math.round(m.memTotal / 2 ** 30)} GB` : '', 'ram', ICON_COLOR.machine),
    meterRow('Ổ đĩa', m.disk, m.diskFree != null ? `còn trống ${(m.diskFree / 2 ** 30).toFixed(0)} GB` : '', 'disk', ICON_COLOR.machine),
  ]));
  $('usage-body').replaceChildren(...parts);
}
async function loadUsage() {
  S.usage = await api('/api/usage?session=' + encodeURIComponent(st().s || '')).catch(() => null);
  renderUsageChip();
  if ($('d-usage').open) renderUsageDialog();
}
$('b-usage').onclick = () => { renderUsageDialog(); $('d-usage').showModal(); loadUsage(); };
setInterval(() => document.visibilityState === 'visible' && loadUsage(), 30_000);
addEventListener('hashchange', () => { if (st().s !== S.usage?.session?.name) loadUsage(); });
loadUsage();
setInterval(() => document.visibilityState === 'visible' && loadMachines(), 60_000);

S.machine = st().m || '';
loadProjects();
setInterval(() => document.visibilityState === 'visible' && loadProjects(), 20_000);
if (!S.list.length) $('sessions').replaceChildren(...skel(3, 'sk tall'));
poll().then(render);
loadRestore();
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && loadRestore());
</script>
